<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<script src="script.js"></script>
		<title>Sua idade</title>
	</head>
	<body>
		<header>
			<h1>Verificador de idade</h1>
		</header>
		<section id="all">
			<div>
				<p>
					Ano de nascimento:
					<input
						type="number"
						name="txtnum"
						id="txtnum"
						inputmode="numeric"
					/><br />
				</p>
				<p>
					Sexo:
					<input type="radio" name="sexo" id="fem" />
					<label for="fem">Feminino</label>
					<input type="radio" name="sexo" id="mas" />
					<label for="mas">Masculino</label>
				</p>
				<p>
					<input
						type="button"
						value="Verificar"
						onclick="verificar()"
					/>
				</p>
			</div>

			<div id="resu">
				Preencha o formulário acima para obter o resultado
			</div>
		</section>
		<footer></footer>
	</body>
</html>
